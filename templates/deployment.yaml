apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "fitnest-role"
        vault.hashicorp.com/agent-inject-secret-config: 'secrets/data/{{ .Chart.Name }}/{{ .Values.vaultEnv | default "development" }}'
        vault.hashicorp.com/agent-inject-template-config: |
          {{ "{{" }}- with secret "secrets/data/{{ .Chart.Name }}/{{ .Values.vaultEnv | default "development" }}" {{ "-}}" }}
          {{ "{{" }}- range $k, $v := .Data.data {{ "}}" }}
          {{ "{{" }} $k {{ "}}" }}={{ "{{" }} $v {{ "}}" }}
          {{ "{{" }}- end {{ "}}" }}
          {{ "{{" }}- end {{ "}}" }}
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "app.fullname" . }}
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort | default 8080 }}
              protocol: TCP
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:file:/vault/secrets/config"
            {{- if .Values.env }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
