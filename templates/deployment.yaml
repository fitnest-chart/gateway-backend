apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "app.fullname" . }}
      # Kubernetes defaults to ndots:5, so Netty's async DNS resolver tries
      # vault.fitnest.az.<search-domain> first and fails without falling back to the
      # absolute name. This service is the only reactive/WebFlux app, so it is the only
      # one using that resolver -- the servlet services resolve the name fine via the
      # JVM's blocking resolver. ndots:1 makes dotted names resolve as absolute first.
      # Bare in-cluster service names (0 dots, e.g. catalog-backend) still use the
      # search domains as before.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort | default 8080 }}
              protocol: TCP
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "vault://"
            - name: SPRING_PROFILES_ACTIVE
              value: "{{ .Values.vaultEnv | default "production" }}"
            - name: SPRING_CLOUD_VAULT_ENABLED
              value: "true"
            - name: SPRING_CLOUD_VAULT_URI
              value: "https://vault.fitnest.az:8200"
            - name: SPRING_CLOUD_VAULT_AUTHENTICATION
              value: "APPROLE"
            - name: SPRING_CLOUD_VAULT_APP_ROLE_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: vault-approle-secret
                  key: role-id
            - name: SPRING_CLOUD_VAULT_APP_ROLE_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: vault-approle-secret
                  key: secret-id
            - name: SPRING_CLOUD_VAULT_KV_BACKEND
              value: "secrets"
            - name: SPRING_CLOUD_VAULT_KV_DEFAULT_CONTEXT
              value: "{{ .Chart.Name }}"
            - name: SPRING_CLOUD_VAULT_KV_PROFILE_SEPARATOR
              value: "/"
            - name: SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE
              value: "100MB"
            - name: SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE
              value: "1000MB"
            - name: SERVER_TOMCAT_MAX_PART_COUNT
              value: "500"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          # Probe paths verified live against this service before rollout.
          # The JVM needs time to boot; the startup probe holds the other two off so a
          # slow start is not mistaken for a crash loop.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3