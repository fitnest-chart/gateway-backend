{{- if .Values.istio.enabled}}
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ .Values.istio.gateway.name}}
  labels:
    {{- include "api-gateway.labels" . | nindent 4}}
spec:
  selector:
    {{- toYaml .Values.istio.gateway.selector | nindent 4}}
  servers:
    - hosts:
        {{- range .Values.istio.gateway.hosts }}
        - {{ . | quote }}
        {{- end }}
      port:
        name: http
        number: 80
        protocol: HTTP
      {{- if and .Values.istio.gateway.tls .Values.istio.gateway.tls.enabled}}
      tls:
        httpsRedirect: true
    - hosts:
        {{- range .Values.istio.gateway.hosts }}
        - {{ . | quote }}
        {{- end }}

      port:
        name: https
        number: 443
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.istio.gateway.tls.credentialName | quote}}
      {{- end}}
  {{- end}}
