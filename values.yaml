replicaCount: 1
image:
  repository: ghcr.io/fitnest-backend/api-gateway
  tag: "development-901d16a"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
hpa:
  enabled: false
  minReplicas: "1"
  maxReplicas: "3"
  cpuUtilization: "90"
  memoryUtilization: "450Mi"
resources:
  requests:
    cpu: 17m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1024Mi
env:
  SPRINGDOC_SERVER_URL: "https://dev-api.fitnest.az"
  JWT_SECRET: "your-jwt-secret-change-in-production"
  JWT_ISSUER: "fitnest"
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_TIMEOUT: "2000ms"
  IDENTITY_SERVICE_URL: "http://identity-service:8080"
  STORAGE_SERVICE_URL: "http://storage-service:8080"
  # Optional: enable gRPC-based storage client instead of HTTP. When true, set STORAGE_GRPC_ADDRESS.
  USE_GRPC_STORAGE: "false"
  STORAGE_GRPC_ADDRESS: "dns:///storage-service.fitnest-dev.svc.cluster.local:9090"
  JAVA_TOOL_OPTIONS: >
    -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:MaxMetaspaceSize=256m -XX:+AlwaysPreTouch -Xss512k -XX:+ExitOnOutOfMemoryError

istio:
  enabled: true
  pathPrefix: ""
  gateway:
    create: true
    name: public-gateway
    hosts:
      - "dev-api.fitnest.az"
      - "fitnest.az"
    port: 80
    selector:
      istio: ingressgateway
    tls:
      enabled: true
      credentialName: "fitnest-wildcard-tls"
  virtualService:
    create: true
    hosts:
      - "dev-api.fitnest.az"
    corsPolicy:
      allowOrigins:
        - exact: "*"
      allowMethods:
        - POST
        - GET
        - OPTIONS
        - PUT
        - DELETE
      allowHeaders:
        - authorization
        - content-type
        - keep-alive
        - user-agent
        - cache-control
        - content-transfer-encoding
        - x-accept-content-transfer-encoding
        - x-accept-response-streaming
        - x-user-agent
        - x-grpc-web
        - x-internal-token
        - x-user-id
        - x-user-email
        - x-user-roles
        - x-request-id
      maxAge: 100s
    http:
      - match:
          - uri:
              prefix: /v3/api-docs/identity-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: identity-service
              port:
                number: 8080
      - match:
