# Default values for api-gateway
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/fitnest-backend/api-gateway
  tag: "925ec82"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

env:
  JWT_SECRET: "your-jwt-secret-key-change-in-production-min-256-bits"
  JWT_ISSUER: "fitnest"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_TIMEOUT: "2000ms"
  IAM_SERVICE_URL: "http://iam-service:8080"
  MEDIA_SERVICE_URL: "http://media-service:8086"

istio:
  enabled: true
  pathPrefix: ""
  gateway:
    create: true
    name: public-gateway
    host: "*"
    port: 80
    selector:
      istio: ingressgateway
  virtualService:
    create: true
    hosts:
      - "*"
    http:
      - match:
          - uri:
              prefix: /api/v1/
          - uri:
              prefix: /swagger-ui
          - uri:
              prefix: /v3/api-docs
          - uri:
              prefix: /webjars
          - uri:
              exact: /swagger-ui.html
        route:
          - destination:
              host: api-gateway
              port:
                number: 80

destinationRule:
  connectionPool:
    http:
      http1MaxPendingRequests: 100
      http2MaxRequests: 1000
    tcp:
      maxConnections: 100
  loadBalancer:
    simple: ROUND_ROBIN
  outlierDetection:
    consecutive5xxErrors: 5
    interval: 30s
    baseEjectionTime: 30s
    maxEjectionPercent: 50
