# Default values for api-gateway
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
image:
  repository: ghcr.io/fitnest-backend/api-gateway
  tag: "development-cbd2e28"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 45
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
env:
  JWT_SECRET: "your-jwt-secret-change-in-production"
  JWT_ISSUER: "fitnest"
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_REDIS_HOST: "redis.fitnest-dev.svc.cluster.local"
  SPRING_REDIS_PORT: "6379"
  SPRING_REDIS_TIMEOUT: "2000ms"
  IDENTITY_SERVICE_URL: "http://identity-service:8080"
  MEDIA_SERVICE_URL: "http://media-service:8086"
istio:
  enabled: true
  pathPrefix: ""
  gateway:
    create: true
    name: public-gateway
    host: "*"
    port: 80
    selector:
      istio: ingressgateway
  virtualService:
    create: true
    hosts:
      - "*"
    corsPolicy:
      allowOrigins:
        - exact: "*"
      allowMethods:
        - POST
        - GET
        - OPTIONS
        - PUT
        - DELETE
      allowHeaders:
        - authorization
        - content-type
        - keep-alive
        - user-agent
        - cache-control
        - content-transfer-encoding
        - x-accept-content-transfer-encoding
        - x-accept-response-streaming
        - x-user-agent
        - x-grpc-web
        - x-internal-token
        - x-user-id
        - x-user-email
        - x-user-roles
        - x-request-id
      maxAge: 100s
    http:
      # Service API Docs Routes
      - match:
          - uri:
              prefix: /v3/api-docs/identity-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: identity-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /v3/api-docs/media-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: media-service
              port:
                number: 8086
      - match:
          - uri:
              prefix: /v3/api-docs/catalog-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: catalog-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /v3/api-docs/commerce-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: commerce-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /v3/api-docs/marketplace-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: marketplace-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /v3/api-docs/notifications-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: notifications-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /v3/api-docs/payment-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: payment-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /v3/api-docs/subscription-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: subscription-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /v3/api-docs/support-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: support-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /v3/api-docs/user-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: user-service
              port:
                number: 8080
      # General Gateway Routes
      - match:
          - uri:
              prefix: /api/v1/
          - uri:
              prefix: /swagger-ui
          - uri:
              prefix: /v3/api-docs
          - uri:
              prefix: /webjars
          - uri:
              exact: /swagger-ui.html
        route:
          - destination:
              host: api-gateway
              port:
                number: 80
destinationRule:
  connectionPool:
    http:
      http1MaxPendingRequests: 100
      http2MaxRequests: 1000
    tcp:
      maxConnections: 100
  loadBalancer:
    simple: ROUND_ROBIN
  outlierDetection:
    consecutive5xxErrors: 5
    interval: 30s
    baseEjectionTime: 30s
    maxEjectionPercent: 50
