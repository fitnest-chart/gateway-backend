# Default values for api-gateway
# This is a YAML-formatted file.

replicaCount: 1
image:
  repository: ghcr.io/fitnest-backend/api-gateway
  tag: "development-2cf9ddf"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
hpa:
  enabled: false
  minReplicas: "1"
  maxReplicas: "3"
  cpuUtilization: "90"
  memoryUtilization: "450Mi"
resources:
  limits:
    memory: 512Mi
    cpu: 500m
  requests:
    cpu: 250m
    memory: 256Mi
env:
  SPRINGDOC_SERVER_URL: "https://dev-api.fitnest.az"
  JWT_SECRET: "your-jwt-secret-change-in-production"
  JWT_ISSUER: "fitnest"
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_TIMEOUT: "2000ms"
  IDENTITY_SERVICE_URL: "http://identity-service:8080"
  STORAGE_SERVICE_URL: "http://storage-service:8080"
  JAVA_OPTS: "-Xmx384m -Xms192m -XX:+UseZGC -XX:+ZGenerational -Xss256k"
istio:
  enabled: true
  pathPrefix: ""
  gateway:
    create: true
    name: public-gateway
    host: "dev-api.fitnest.az"
    port: 80
    selector:
      istio: ingressgateway
    tls:
      enabled: true
      credentialName: "fitnest-wildcard-tls"
  virtualService:
    create: true
    hosts:
      - "dev-api.fitnest.az"
    corsPolicy:
      allowOrigins:
        - exact: "*"
      allowMethods:
        - POST
        - GET
        - OPTIONS
        - PUT
        - DELETE
      allowHeaders:
        - authorization
        - content-type
        - keep-alive
        - user-agent
        - cache-control
        - content-transfer-encoding
        - x-accept-content-transfer-encoding
        - x-accept-response-streaming
        - x-user-agent
        - x-grpc-web
        - x-internal-token
        - x-user-id
        - x-user-email
        - x-user-roles
        - x-request-id
      maxAge: 100s
    http:
      # Service API Docs Routes
      - match:
          - uri:
              prefix: /v3/api-docs/identity-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: identity-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /v3/api-docs/storage-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: storage-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /v3/api-docs/catalog-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: catalog-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /v3/api-docs/commerce-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: commerce-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /v3/api-docs/catalog-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: catalog-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /v3/api-docs/notifications-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: notifications-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /v3/api-docs/payment-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: payment-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /v3/api-docs/subscription-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: subscription-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /v3/api-docs/support-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: support-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /v3/api-docs/user-service
        rewrite:
          uri: /v3/api-docs
        route:
          - destination:
              host: user-service
              port:
                number: 8080
      # Specific catalog store routes (must come before general /api/v1/ catch-all)
      - match:
          - uri:
              prefix: /api/v1/stores/admin
        route:
          - destination:
              host: catalog-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /api/v1/stores/
        route:
          - destination:
              host: catalog-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /api/v1/stores
        route:
          - destination:
              host: catalog-service
              port:
                number: 8080
      # Super Admin Routes
      - match:
          - uri:
              prefix: /api/v1/super-admin/users
        route:
          - destination:
              host: identity-service
              port:
                number: 8080
      - match:
          - uri:
              prefix: /api/v1/super-admin
        route:
          - destination:
              host: catalog-service
              port:
                number: 8080
      # General Gateway Routes (catch-all for api gateway paths)
      - match:
          - uri:
              prefix: /api/v1/
          - uri:
              prefix: /swagger-ui
          - uri:
              prefix: /v3/api-docs
          - uri:
              prefix: /webjars
          - uri:
              exact: /swagger-ui.html
        route:
          - destination:
              host: api-gateway
              port:
                number: 80
destinationRule:
  connectionPool:
    http:
      http1MaxPendingRequests: 100
      http2MaxRequests: 1000
    tcp:
      maxConnections: 100
  loadBalancer:
    simple: ROUND_ROBIN
  outlierDetection:
    consecutive5xxErrors: 5
    interval: 30s
    baseEjectionTime: 30s
    maxEjectionPercent: 50
